services:
  - type: web
    name: codecrux
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd proctoring && gunicorn proctoring.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "False"
